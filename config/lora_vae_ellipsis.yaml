experiment:
  name: adapt_vae_ellipsis

pretrained_model: runs/vae_ellipsis_source_2/checkpoints/best.pt

paths:
  dataset_dir: datasets
  runs_dir: runs

dataset:
  name: ellipsis_dataset
  train: true
  train_split: 0.8
  shape: [1, 28, 28]

dataloader:
  batch_size: 128
  shuffle_train: true
  shuffle_validation: false
  num_workers: 0

training:
  epochs: 200
  learning_rate: 0.01

loss:
  name: vae_loss
  log_prob_function: bernoulli
  beta: 2.0

model:
  name: vae
  encoder:
    latent_dim: 4
    out_channels: [16, 32, 64]
    kernels: [3, 3, 3]
    strides: [2, 2, 2]
    paddings: [1, 1, 1]
  decoder:
    symmetrical: true

optimizer:
  name: adam

lr_scheduler:
  name: reduce_lr_on_plateau
  mode: min
  threshold: 0.5
  threshold_mode: abs
  min_lr: 0.0001
  factor: 0.5
  patience: 15
  cooldown: 5
  start_epoch: 80

scoring:
  out_distribution_datasets: [vertical_lines_dataset]
  dataloader:
    batch_size: 128
    num_workers: 0
  signals:
    likelihood:
      enabled: false
    typicality:
      enabled: false
    gradnorm:
      enabled: false
    latent_encoding:
      enabled: false
    hole_mass:
      enabled: false

lora:
  pretrained_model: null
  layers_to_inject:
    encoder: [fc, conv]
    decoder: [fc, conv, convtranspose]
  rank: 8
  alpha: 4
  transformed_dataset:
    name: rotated_ellipsis
    type: rotation
    intensity: 90.0
    train: true
    train_split: 0.8
    shape: [1, 28, 28]
  regularizer: Null

seed: 42
