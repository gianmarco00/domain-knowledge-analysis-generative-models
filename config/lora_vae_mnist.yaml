experiment:
  name: adapt_vae_mnist

pretrained_model: runs/vae_mnist_lr_0.001_29_jul_1606_B_beta_1.7_LD_16/checkpoints/best.pt

paths:
  dataset_dir: datasets
  runs_dir: runs

dataset:
  name: mnist
  train: true
  train_split: 0.8
  shape: [1, 28, 28]

dataloader:
  batch_size: 128
  shuffle_train: true
  shuffle_validation: false
  num_workers: 0

training:
  epochs: 160
  learning_rate: 0.001

loss:
  name: vae_loss
  log_prob_function: bernoulli
  beta: 1.7

model:
  name: vae

  encoder:
    latent_dim: 16
    out_channels: [32, 64, 128, 128]
    kernels: [3, 3, 3, 3]
    strides: [2, 2, 2, 1]
    paddings: [1, 1, 1, 1]

  decoder:
    symmetrical: true

optimizer:
  name: adam

lr_scheduler:
  name: reduce_lr_on_plateau
  mode: min
  threshold: 0.5
  threshold_mode: abs
  min_lr: 0.0001
  factor: 0.5
  patience: 15
  cooldown: 5
  start_epoch: 50


scoring:
  out_distribution_datasets: [fashion_mnist, organamnist, kmnist]

  dataloader:
    batch_size: 128
    num_workers: 0

  signals:
    likelihood:
      enabled: false
    typicality:
      enabled: false
    gradnorm:
      enabled: false
    latent_encoding:
      enabled: false
    hole_mass:
      enabled: false

lora:
  pretrained_model: Null
  layers_to_inject:
    encoder: [fc, conv]
    decoder: [fc, conv, convtranspose]
  rank: 8
  alpha: 4
  transformed_dataset:
    name: rotated_mnist
    type: rotation
    intensity: 45.0
    train: true
    train_split: 0.8
    shape: [1, 28, 28]
  regularizer:
    num_anchor_points: 300
    eta: 1.0
    transformations: 
      - ["rotation", [15, 30, 45]]


seed: 42