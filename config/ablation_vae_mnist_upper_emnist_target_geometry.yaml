# 26 runs: 1 seed x (1 ordinary LoRA + 12 full + 12 target-only + 1 source-only).
# Both full and target-only cover every eta x geometry batch size x dual rate.
# B is shared by source calibration, target training geometry and geometry validation.
# All 26 models inherit LR=0.01 and training.gradient_clipping (enabled, max_norm=100)
# from the base config. Toggle it there; this includes the ordinary LoRA baseline.
# Keep this clipped study's results separate from the previous unclipped runs.
base_config: config/lora_vae_mnist_upper_emnist.yaml
ablation:
  regularizer_mode: target_geometry
  output_dir: ablations/vae_mnist_upper_emnist_target_geometry_clipped
  parallel_models: 14
  seeds:
  - 42
  eta_values:
  - 10.0
  - 100.0
  - 1000.0
  geometry_batch_sizes:
  - 32
  - 64
  dual_learning_rates:
  - 0.01
  - 0.1
  controls:
  - view: source_only
    eta: 100.0
    geometry_batch_size: 64
  visual_seed: 123
  fid_seed: 123
  fid_batch_size: 512
  num_qualitative_images: 6
  source_label: MNIST source
  target_label: EMNIST digit-like letters target
